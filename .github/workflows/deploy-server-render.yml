name: Deploy Server (Render Prod)

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: render-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    env:
      NODE_ENV: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

      - name: Runtime check
        run: node -e "console.log('server ok')"

      - name: Select migration database URL
        run: |
          if [ -n "${{ secrets.DIRECT_DATABASE_URL }}" ]; then
            echo "DATABASE_URL=${{ secrets.DIRECT_DATABASE_URL }}" >> $GITHUB_ENV
          else
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          fi

      - name: Run database migrations
        run: npm run db:migrate

      - name: Sync schema (one-time override)
        if: env.RUN_DB_SYNC == 'true'
        env:
          RUN_DB_SYNC: ${{ secrets.RUN_DB_SYNC }}
          ALLOW_DB_SYNC_IN_PROD: true
        run: npm run db:sync

      - name: Trigger Render deploy hook
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
