name: Deployment Pipeline for develop branch [develop]

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_DEV }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/everest-vacation-backend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/everest-vacation-backend:${{ github.sha }}

  deploy-azure:
    name: Deploy to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}

      - name: Prepare .env on Azure VM
        run: |
          ssh -o StrictHostKeyChecking=no azureuser@${{ secrets.AZURE_VM_IP_DEV }} <<'EOF'
          set -euo pipefail

          mkdir -p /home/azureuser/everest-vacation/server

          cat > /home/azureuser/everest-vacation/server/.env <<EOL
          PORT=${{ secrets.PORT_DEV }}
          DB_NAME=${{ secrets.DB_NAME_DEV }}
          DB_USERNAME=${{ secrets.DB_USERNAME_DEV }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD_DEV }}
          DB_HOST=${{ secrets.DB_HOST_DEV }}
          DB_PORT=${{ secrets.DB_PORT_DEV }}
          SSL=${{ secrets.SSL_DEV }}
          DB_DIALECT=${{ secrets.DB_DIALECT_DEV }}
          SECRET_KEY=${{ secrets.SECRET_KEY_DEV }}
          JWT_SECRET=${{ secrets.JWT_SECRET_DEV }}
          ADMIN_MAIL=${{ secrets.ADMIN_MAIL_DEV }}
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN_DEV }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME_DEV }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY_DEV }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET_DEV }}
          SMTP_EMAIL=${{ secrets.SMTP_EMAIL_DEV }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD_DEV }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL_DEV }}
          EOL
          EOF

      - name: Deploy containers on Azure VM
        run: |
          ssh -o StrictHostKeyChecking=no azureuser@${{ secrets.AZURE_VM_IP_DEV }} <<'EOF'
          set -euo pipefail

          cd /home/azureuser/everest-vacation

          # ---- force latest git state ----
          git fetch origin develop
          git reset --hard origin/develop
        
          # ---- Docker deployment ----
          echo "${{ secrets.DOCKERHUB_TOKEN_DEV }}" | \
            docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

          docker compose pull
          docker compose down --remove-orphans
          docker compose up -d

          docker image prune -af || true

          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

          sleep 5
          curl -f http://localhost:8008/health || echo "⚠️ Health check failed"
          EOF
