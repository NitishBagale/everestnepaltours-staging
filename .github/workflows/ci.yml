name: build & deploy

on:
  push:
    branches:
      - staging

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create env
        run:
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_STAGING }}" > client/.env

      - name: Build Docker image
        run: |
          # frontend
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/stg-everestvacation-fe:${{ env.IMAGE_TAG }} \
            -f client/Dockerfile \
            .
  
          # backend
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/stg-everestvacation-be:${{ env.IMAGE_TAG }} \
            -f server/Dockerfile \
            .
        
      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/stg-everestvacation-fe:${{ env.IMAGE_TAG }}
          docker push ghcr.io/${{ github.repository_owner }}/stg-everestvacation-be:${{ env.IMAGE_TAG }}
  # 🚀 DEPLOY JOB
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build   # 👈 depends on build job

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_HOST_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<EOF
          set -e

          cd ${{ secrets.DEPLOY_DIR }}

          echo "Deploying IMAGE_TAG=${{ github.sha }}"
          IMAGE_TAG=${{ github.sha }}
          # Update .env with new tag
          if grep -q "^IMAGE_TAG=" .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
          else
            echo "IMAGE_TAG=$IMAGE_TAG" >> .env
          fi

          # Pull new images
          docker compose pull

          # Restart containers
          docker compose up -d

          # Cleanup
          docker image prune -af

          echo "Deployment complete"
          EOF