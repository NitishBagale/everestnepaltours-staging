name: build & deploy

on:
  push:
    branches:
      - staging

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create env
        run: echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_STAGING }}" > client/.env

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/pasang-rumba/stg-everestvacation-fe:${{ env.IMAGE_TAG }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/pasang-rumba/stg-everestvacation-be:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_HOST_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<EOF
          set -e

          cd ${{ secrets.DEPLOY_DIR }}

          echo "Deploying IMAGE_TAG=${{ github.sha }}"
          IMAGE_TAG=${{ github.sha }}

          if grep -q "^IMAGE_TAG=" .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
          else
            echo "IMAGE_TAG=$IMAGE_TAG" >> .env
          fi

          docker compose pull
          docker compose up -d
          docker image prune -af

          cd /root/proxy && docker compose restart nginx

          echo "Deployment complete"
          EOF
